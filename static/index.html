<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Asset Browser</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <h1 class="brand">Asset Browser</h1>
      <div id="account" class="account-menu" hidden>
        <button id="account-toggle" class="account-toggle" type="button"
                aria-haspopup="true" aria-expanded="false" aria-controls="account-popover">
          <span id="account-avatar" class="avatar" aria-hidden="true"></span>
          <span class="account-name">
            <strong id="current-user"></strong>
            <span id="current-role" class="role-chip"></span>
          </span>
          <span class="chevron" aria-hidden="true"></span>
        </button>
        <div id="account-popover" class="popover" hidden>
          <div class="popover-head">
            <span id="popover-avatar" class="avatar avatar-large" aria-hidden="true"></span>
            <div>
              <strong id="popover-user"></strong>
              <p id="popover-role" class="popover-role"></p>
            </div>
          </div>
          <button id="manage-accounts" type="button" class="menu-item" hidden>Manage accounts</button>
          <button id="logout" type="button" class="menu-item">Log out</button>
        </div>
      </div>
    </div>
  </header>

  <dialog id="accounts-dialog" class="dialog" aria-labelledby="accounts-title">
    <div class="dialog-head">
      <h2 id="accounts-title">Accounts</h2>
      <button id="accounts-close" type="button" class="icon-button" aria-label="Close">&times;</button>
    </div>
    <p id="accounts-message" class="dialog-message" role="status"></p>
    <ul id="account-list" class="account-list"></ul>
    <h3 class="dialog-subhead">Create an account</h3>
    <form id="account-form" class="dialog-form">
      <label>
        Username
        <input name="username" required minlength="3" maxlength="32" pattern="[A-Za-z0-9._\-]+"
               title="Letters, numbers, dots, dashes or underscores"
               autocomplete="off" autocapitalize="none" spellcheck="false">
      </label>
      <label>
        Role
        <select name="role">
          <option value="user">User: view, add and edit</option>
          <option value="admin">Admin: also delete and manage accounts</option>
        </select>
      </label>
      <label>
        Password
        <input name="password" type="password" required minlength="8" autocomplete="new-password">
      </label>
      <label>
        Type it again
        <input name="confirm" type="password" required autocomplete="new-password">
      </label>
      <div class="dialog-actions">
        <button id="account-button" type="submit">Create account</button>
      </div>
    </form>
  </dialog>

  <main>

    <section id="login-section" hidden>
      <form id="login-form" class="panel login-form">
        <label>
          Username
          <input id="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
        </label>
        <label>
          Password
          <input id="password" type="password" autocomplete="current-password" required>
        </label>
        <button type="submit">Log in</button>
        <p id="login-error" class="problem" role="alert"></p>
      </form>
    </section>

    <section id="app-section" hidden>
      <div class="stats">
        <div class="stat panel"><span class="stat-label">Total assets</span><strong id="stat-total">0</strong></div>
        <div class="stat panel"><span class="stat-label">In use</span><strong id="stat-in-use">0</strong></div>
        <div class="stat panel"><span class="stat-label">Not in use</span><strong id="stat-not-in-use">0</strong></div>
        <div class="stat panel"><span class="stat-label">Answered by</span><strong id="stat-server">-</strong></div>
      </div>
      <p id="message" role="status">Loading...</p>
      <details class="panel add-panel">
        <summary>Add an asset</summary>
        <form id="add-form" class="add-form">
          <label>
            Description
            <input name="description" required maxlength="1000" placeholder="Dell Latitude 5440 laptop">
          </label>
          <label>
            Category
            <input name="category" required maxlength="1000" placeholder="IT Equipment">
          </label>
          <label>
            Location
            <input name="location" required maxlength="1000" placeholder="Site A - IT Store">
          </label>
          <label>
            Status
            <select name="status">
              <option>In Use</option>
              <option>Not In Use</option>
            </select>
          </label>
          <button id="add-button" type="submit">Add asset</button>
        </form>
      </details>
      <section id="edit-panel" class="panel edit-panel" hidden>
        <h2 id="edit-heading">Edit an asset</h2>
        <form id="edit-form" class="add-form">
          <label>
            Description
            <input name="description" required maxlength="1000">
          </label>
          <label>
            Category
            <input name="category" required maxlength="1000">
          </label>
          <label>
            Location
            <input name="location" required maxlength="1000">
          </label>
          <label>
            Status
            <select name="status">
              <option>In Use</option>
              <option>Not In Use</option>
            </select>
          </label>
          <div class="edit-buttons">
            <button id="edit-button" type="submit">Save changes</button>
            <button id="edit-cancel" type="button" class="secondary">Cancel</button>
          </div>
        </form>
      </section>
      <p id="action-message" role="alert"></p>
      <form id="filters" class="filters">
        <label>
          Search
          <input id="search" type="search" placeholder="Description, location, tags...">
        </label>
        <label>
          Status
          <select id="status-filter">
            <option value="">All statuses</option>
          </select>
        </label>
      </form>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th scope="col">Asset ID</th>
              <th scope="col">Description</th>
              <th scope="col">Category</th>
              <th scope="col">Location</th>
              <th scope="col">Status</th>
              <th scope="col">Tags</th>
              <th scope="col">Date Registered</th>
              <th scope="col"><span class="visually-hidden">Actions</span></th>
            </tr>
          </thead>
          <tbody id="assets"></tbody>
        </table>
      </div>
    </section>
  </main>
</body>
</html>
